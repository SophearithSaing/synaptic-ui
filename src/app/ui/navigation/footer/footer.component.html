<footer class="footer">
  <div class="footer__inner">
    <div>
      <span class="footer__brand">{{ brand }}</span>
      @if (copy) {
        <span class="footer__copy">{{ copy }}</span>
      }
    </div>

    @if (links.length) {
      <nav class="footer__nav" [attr.aria-label]="ariaLabel">
        @for (link of links; track link.label) {
          @if (link.routerLink) {
            <a [routerLink]="link.routerLink">{{ link.label }}</a>
          } @else {
            <a [href]="link.href">{{ link.label }}</a>
          }
        }
      </nav>
    }
  </div>
</footer>

<article class="info-card" [class.info-card--interactive]="interactive">
  @if (icon !== null) {
    <span class="info-card__icon material-symbols-outlined" aria-hidden="true">
      {{ icon }}
    </span>
  }
  <h3 class="info-card__title">{{ title }}</h3>
  <p class="info-card__text">{{ description }}</p>
  <ng-content></ng-content>
</article>

<main class="login-main">
  <syn-form-panel
    title="Log In"
    titleId="login-title"
    description="Secure access for technical mastery."
    [error]="errorMessage()"
    (formSubmit)="onSubmit($event)"
  >
    <syn-form-field label="Username or Email" forId="loginIdentifier">
      <syn-input
        inputId="loginIdentifier"
        name="identifier"
        autocomplete="username"
        icon="person"
        placeholder="student@example.com"
        required
      />
    </syn-form-field>

    <syn-form-field label="Password" forId="loginPassword">
      <syn-text-link
        synFormFieldAction
        label="Forgot Password?"
        href="#forgot"
        subtle
      />
      <syn-input
        inputId="loginPassword"
        name="password"
        type="password"
        autocomplete="current-password"
        icon="lock"
        placeholder="••••••••"
        required
      />
    </syn-form-field>

    <syn-button
      [label]="submitting() ? 'Logging In' : 'Log In'"
      icon="arrow_forward"
      type="submit"
      [disabled]="submitting()"
    />

    <p synFormPanelFooter>
      Require access?
      <syn-text-link label="Sign Up" routerLink="/register" />
    </p>
  </syn-form-panel>
</main>

<syn-page-shell>
  <syn-nav-bar synPageHeader>
    <syn-brand synNavBarBrand routerLink="/" ariaLabel="Synaptic home" />

    <syn-nav-items
      synNavBarNav
      ariaLabel="Registration navigation"
      [items]="navItems"
    />

    <button
      synNavBarMenu
      class="syn-menu-button"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="mobileNavOpen()"
      (click)="toggleMobileNav()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ mobileNavOpen() ? "close" : "menu" }}
      </span>
    </button>

    @if (mobileNavOpen()) {
      <syn-mobile-nav
        synNavBarMobileNav
        [items]="navItems"
        [actions]="navActions"
        (navigate)="closeMobileNav()"
      />
    }
  </syn-nav-bar>

  <syn-form-shell center>
    <syn-form-panel
      title="Establish Identity"
      titleId="register-title"
      description="Register your institutional credentials for access to the research network."
      [error]="errorMessage()"
      (formSubmit)="onSubmit($event)"
    >
      <syn-form-field label="Username" forId="username">
        <syn-input
          inputId="username"
          name="username"
          autocomplete="username"
          icon="person"
          placeholder="student123"
          required
        />
      </syn-form-field>

      <syn-form-field label="Email" forId="email">
        <syn-input
          inputId="email"
          name="email"
          type="email"
          autocomplete="email"
          icon="mail"
          placeholder="student@example.com"
          required
        />
      </syn-form-field>

      <syn-form-field label="Password" forId="password">
        <syn-input
          inputId="password"
          name="password"
          type="password"
          autocomplete="new-password"
          icon="key"
          placeholder="Create password"
          required
        />
      </syn-form-field>

      <syn-form-field label="Confirm Password" forId="confirmPassword">
        <syn-input
          inputId="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          icon="lock"
          placeholder="Repeat password"
          required
        />
      </syn-form-field>

      <syn-button
        [label]="submitting() ? 'Signing Up' : 'Sign Up'"
        icon="arrow_forward"
        type="submit"
        [disabled]="submitting()"
      />

      <p synFormPanelFooter>
        Already authenticated?
        <syn-text-link label="Log In" routerLink="/login" />
      </p>
    </syn-form-panel>
  </syn-form-shell>

  <syn-footer
    synPageFooter
    [brand]="null"
    copy="© 2026 Synaptic. Not a real company."
  />
</syn-page-shell>

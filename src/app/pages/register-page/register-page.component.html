<syn-page-shell>
  <syn-form-shell center>
    <syn-form-panel
      title="Establish Identity"
      titleId="register-title"
      description="Register your institutional credentials for access to the research network."
      [error]="errorMessage()"
      (formSubmit)="onSubmit($event)"
    >
      <syn-form-field label="Username" forId="username">
        <syn-input
          inputId="username"
          name="username"
          autocomplete="username"
          icon="person"
          placeholder="student123"
          required
        />
      </syn-form-field>

      <syn-form-field label="Email" forId="email">
        <syn-input
          inputId="email"
          name="email"
          type="email"
          autocomplete="email"
          icon="mail"
          placeholder="student@example.com"
          required
        />
      </syn-form-field>

      <syn-form-field label="Password" forId="password">
        <syn-input
          inputId="password"
          name="password"
          type="password"
          autocomplete="new-password"
          icon="key"
          placeholder="Create password"
          required
        />
      </syn-form-field>

      <syn-form-field label="Confirm Password" forId="confirmPassword">
        <syn-input
          inputId="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          icon="lock"
          placeholder="Repeat password"
          required
        />
      </syn-form-field>

      <syn-button
        [label]="submitting() ? 'Signing Up' : 'Sign Up'"
        icon="arrow_forward"
        type="submit"
        [disabled]="submitting()"
      />

      <p synFormPanelFooter>
        Already authenticated?
        <syn-text-link label="Log In" routerLink="/login" />
      </p>
    </syn-form-panel>
  </syn-form-shell>
</syn-page-shell>

<syn-nav-bar>
  <syn-brand
    synNavBarBrand
    [routerLink]="brandRouterLink()"
    ariaLabel="Synaptic home"
  />

  @if (!sessionRoute()) {
    <syn-nav-items
      synNavBarNav
      ariaLabel="Primary navigation"
      [items]="navItems()"
    />
  }

  <div
    synNavBarActions
    class="app-navbar__actions"
    [class.app-navbar__actions--session]="sessionRoute()"
  >
    @if (sessionRoute()) {
      <syn-button label="Exit" variant="secondary" routerLink="/home" />
    } @else if (authenticated()) {
      <syn-button
        label="Log Out"
        variant="secondary"
        (buttonClick)="logOut()"
      />
    } @else {
      <syn-button label="Log In" routerLink="/login" variant="secondary" />
      <syn-button label="Sign Up" routerLink="/register" />
    }
  </div>

  @if (!sessionRoute()) {
    <button
      synNavBarMenu
      class="syn-menu-button"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="mobileNavOpen()"
      (click)="toggleMobileNav()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ mobileNavOpen() ? "close" : "menu" }}
      </span>
    </button>
  }

  @if (mobileNavOpen() && !sessionRoute()) {
    <syn-mobile-nav
      synNavBarMobileNav
      [items]="navItems()"
      [actions]="mobileActions()"
      (action)="onMobileAction($event)"
      (navigate)="closeMobileNav()"
    />
  }
</syn-nav-bar>
